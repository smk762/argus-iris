# argus-iris residency policy (rollout step 4, #6). Point IRIS_POLICY at a copy (compose: IRIS_POLICY_FILE).
# Report-only as shipped: no rule has `enforce: true`, so iris shows on the dashboard what it would do and does nothing.
# Hand residents over one at a time: set the resident's own timer to -1 (table in #6) and `enforce: true` here, in the
# same change, after iris has evicted it correctly at least once by hand (the dashboard's Evict).
timezone: America/Los_Angeles      # cron fields only; everything else is UTC

windows: []
#  - name: nightly-audit
#    cron: "0 1 * * *"
#    duration: 5h
#    tenant: ai-code-auditor
#    target: "ollama:*"
#    class: batch

residents:                         # first matching rule wins; fnmatch patterns
  # SingGuard on dragon's Ollama: no longer pinned. The suite's guard checks go to argus-retina's SingGuard on morpheus
  # (agent-composer#77), and jarrah has the model pulled for an ollama:SingGuard lease that does not fit dragon. Its
  # 5.3 GB pin crowded XTTS and Qwen off the 4060 (#40), so anything that still loads it goes after a minute idle.
  - match: { node: dragon, ollama: "hf.co/inclusionAI/SingGuard-4b-GGUF:*" }
    idle_kill: 60s
  # agent-composer's sidecars (#6 table). Their own timers: *_KEEP_ALIVE_GPU / _CPU, INFINITY_IDLE_TIMEOUT.
  # Hand over by setting only *_KEEP_ALIVE_GPU=-1. With it at -1 the sidecar never runs its CPU stage either,
  # so iris owns that too: unload_after = the old *_KEEP_ALIVE_CPU.
  - match: { resident: "dragon/xtts" }
    idle_kill: 120s                # GPU -> CPU, kept warm ...
    unload_after: 600s             # ... then unloaded, freeing host RAM (was XTTS_KEEP_ALIVE_CPU)
    restart_residual_mb: 64        # an unload leaves ~146 MB of CUDA context; only a restart returns it
  - match: { resident: "dragon/tts" }
    idle_kill: 120s
    unload_after: 600s
    restart_residual_mb: 64        # an unload, or a load that failed for want of room, can leave ~1.3 GB (#40)
  - match: { resident: "dragon/whisper" }
    idle_kill: 120s                # no CPU stage: unloaded at once
  - match: { resident: "dragon/modernbert" }
    idle_kill: 300s
    unload_after: 0s               # MODERNBERT_KEEP_ALIVE_CPU=0: straight from CPU to unloaded
    restart_residual_mb: 64        # an unload leaves ~94 MB of CUDA context; only a restart returns it
  - match: { resident: "dragon/infinity" }
    idle_kill: 10m
  # Immich's ML server (evict_by: stop): with nothing but enforce, admission may stop it when a lease on dragon needs
  # the room, and iris starts it again once no lease is active there. Leave enforce off to see "would stop" first.
  - match: { resident: "dragon/immich-ml" }
    enforce: false
  # argus-lens has no timer of its own unless ARGUS_IDLE_UNLOAD_S is set: a loaded captioner stays for ever.
  - match: { resident: "morpheus/lens" }
    idle_kill: 15m
  # Ollama on dragon: with OLLAMA_KEEP_ALIVE=server, iris extends keep_alive until idle-kill.
  - match: { node: dragon, ollama: "*" }
    idle_kill: 15m
  # jarrah: mithrandir keeps qwen3:8b warm on purpose. A pin: keep_alive -1, never evicted (admission honours it even
  # unenforced). Enforced, a pinned resident that drops out anyway (an unload by hand, a restart, an OOM) is loaded
  # again, at the context it had, once no lease is active on the node and there is room; `restore: false` turns that off.
  - match: { node: jarrah, ollama: "qwen3:8b" }
    keepalive: always
  # jarrah: one model fills the card; keep it moving.
  - match: { node: jarrah, ollama: "*" }
    idle_kill: 5m
  # voluptas on morpheus (Miso keeps ~2 GB reserved after unload: voluptas#26).
  - match: { resident: "morpheus/miso" }
    idle_kill: 15m
    restart_residual_mb: 512
  - match: { resident: "morpheus/comfyui" }
    idle_kill: 30m                 # replaces COMFYUI_IDLE_TIMEOUT_SECONDS
    restart_host_ram_mb: 12288     # idle 120 s with more host RAM than this: restart (COMFYUI_MEM_RESTART_MB, #20)
