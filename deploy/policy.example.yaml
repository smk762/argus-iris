# argus-iris residency policy. Point IRIS_POLICY at a copy (compose: IRIS_POLICY_FILE).
# Report-only as shipped: no rule has `enforce: true`, so iris shows on the dashboard what it would do and does nothing.
# Hand residents over one at a time: set the resident's own idle timer to -1 and `enforce: true` here, in the same
# change, after iris has evicted it correctly at least once by hand (the dashboard's Evict).
timezone: UTC                    # cron fields only; everything else is UTC

windows: []
#  - name: nightly-audit
#    cron: "0 1 * * *"
#    duration: 5h
#    tenant: ai-code-auditor
#    target: "ollama:*"
#    class: batch

residents:                         # first matching rule wins; fnmatch patterns
  - match: { resident: "rtx4060/xtts" }
    idle_kill: 120s                # GPU -> CPU, kept warm ...
    unload_after: 600s             # ... then unloaded, freeing host RAM
    restart_residual_mb: 64        # an unload leaves ~146 MB of CUDA context; only a restart returns it
  # evict_by: stop. With nothing but enforce, admission may stop it when a lease needs the room, and iris starts it
  # again once no lease is active there. Leave enforce off to see "would stop" first.
  - match: { resident: "rtx4060/immich-ml" }
    enforce: false
  - match: { resident: "rtx3090/lens" }
    idle_kill: 15m
  # With OLLAMA_KEEP_ALIVE=server, iris extends keep_alive until idle-kill.
  - match: { node: rtx4060, ollama: "*" }
    idle_kill: 15m
  # A pin: keep_alive -1, never evicted (admission honours it even unenforced). Enforced, a pinned resident that drops
  # out anyway (an unload by hand, a restart, an OOM) is loaded again, at the context it had, once no lease is active
  # on the node and there is room; `restore: false` turns that off.
  - match: { node: gtx1070, ollama: "qwen3:8b" }
    keepalive: always
  - match: { node: gtx1070, ollama: "*" }
    idle_kill: 5m                  # one model fills the card; keep it moving
  - match: { resident: "rtx3090/comfyui" }
    idle_kill: 30m
    restart_host_ram_mb: 12288     # idle 120 s with more host RAM than this: restart
