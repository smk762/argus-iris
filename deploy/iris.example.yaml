# argus-iris broker config: an example with three GPU nodes named after their cards. Point IRIS_CONFIG at a copy.
# The broker container does not see the host's /etc/hosts: use names your DNS resolves, or IPs.
poll_s: 5
agent_timeout_s: 3

nodes:
  rtx3090:
    agent_url: http://rtx3090:9110
    reserve_mb: 3500        # a desktop display: never handed out
  rtx4060:
    agent_url: http://rtx4060:9110
  gtx1070:
    agent_url: http://gtx1070:9110

# Services that hold residents. `container` matches the agent's GPU processes to the service; without it the
# service's VRAM shows up as an unclaimed "process" resident instead. A lease target names a service by its id, its
# adapter, or a name in its `serves` list. `warm_mb` (else the most iris has seen it hold) is what it needs: iris flags
# it `crowded_out` when what the node can never free (pins, unmanaged processes, unloaded residues) leaves less.
services:
  - { id: comfyui, node: rtx3090, adapter: comfyui, base_url: "http://rtx3090:8188", container: comfyui }

  # Two Ollamas: placement prefers the one with the model loaded, then config order. The broker must reach them, so
  # bind them to a LAN address, not 127.0.0.1.
  - { id: ollama-rtx4060, node: rtx4060, adapter: ollama, base_url: "http://rtx4060:11434", container: ollama }
  - { id: ollama-gtx1070, node: gtx1070, adapter: ollama, base_url: "http://gtx1070:11434", container: ollama }

  # argus-http: any service with the resident contract. /health carries model_state, busy and idle_s; the paths below
  # are its lifecycle routes; token_env names the variable holding its admin token (reads stay open).
  - { id: xtts, node: rtx4060, adapter: argus-http, base_url: "http://rtx4060:8141", container: argus-echo-xtts,
      warm_path: /admin/wake, evict_path: /admin/evict, warm_mb: 2000, token_env: ECHO_ADMIN_TOKEN }

  # A second home for target `xtts`: `serves` lets a lease spill here when the first is down or, under
  # admission: enforce, has no room. The grant's base_url tells the caller which one to call.
  - { id: echo-xtts, node: rtx3090, adapter: argus-http, base_url: "http://rtx3090:8141", container: argus-echo-xtts,
      serves: [xtts], warm_path: /admin/wake, evict_path: /admin/evict, warm_mb: 2000, token_env: ECHO_ADMIN_TOKEN }

  # No evict or wake route: /admin/unload frees the model and the next request reloads it.
  - { id: lens, node: rtx3090, adapter: argus-http, base_url: "http://rtx3090:8100", container: argus-lens,
      token_env: LENS_ADMIN_TOKEN }

  # external: no resident contract, up/down from health_path only. evict_by: stop lets iris stop the container (its
  # clients must have a fallback) once a policy rule matching it is enforced. Its container must also be in that
  # agent's IRIS_AGENT_CONTAINERS.
  - { id: immich-ml, node: rtx4060, adapter: external, base_url: "http://rtx4060:3003", health_path: /ping,
      container: immich_machine_learning, evict_by: stop }

# Tenants' own containers. An in-process lease counts the VRAM its tenant's own process already holds (a loaded
# model, an allocator arena) as part of what it asks for, and admission never evicts a tenant's residents for that
# tenant's lease. A process whose compose service is the tenant's name is linked without an entry.
# tenants:
#   argus-curator: { containers: ["curator-worker"] }

# Admission. "observe" (the default) grants every lease at once and records whether it would have fit; "enforce"
# queues what does not fit, spills to the next node (the Ollama serving fewer leases first,
# skipping one that has not pulled the model), and evicts idle residents
# (least recently used, never busy or pinned) to make room. Watch iris_leases_over_admissible in observe first.
admission: observe
admission_min_idle_s: 60          # before a lower-class resident is evicted
admission_same_class_idle_s: 300  # idle and loaded this long before a same-class one is (no ping-pong)
lease_stall_s: 1800              # granted, heartbeating, no GPU activity this long: stalled (asked to yield if blocking)
lease_stall_reclaim: false       # true: also end a stalled lease that blocks the queue, after lease_stall_s / 2 more
pinned: []                    # resident ids (fnmatch) admission never evicts, e.g. "gtx1070/ollama-gtx1070/qwen3:8b"

# Self-registration. A tenant's gpu-tenant.yaml residents become services once an agent reports their containers (node
# and published port from the agent's inventory), and agents with IRIS_BROKER_URL announce their nodes. The entries
# above win. Registrations persist in $IRIS_STATE_DIR (the broker compose file mounts a volume there).
register_services: true
register_nodes: true
registration_ttl_s: 900          # not renewed this long: lapsed (kept while the container exists)

# Service directory: containers labelled argus.peer on any node are listed at /directory with their health. Name
# peers here that no agent can see (a host without iris-agent); they come first for that name.
# peers:
#   ocr: http://192.0.2.50:8133
directory_health_s: 30

# Browser origins allowed to make state-changing requests.
trusted_origins: []
