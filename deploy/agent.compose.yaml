# iris-agent: one per GPU host. `docker compose -f deploy/agent.compose.yaml up -d`
services:
  iris-agent:
    image: ghcr.io/smk762/argus-iris:${IRIS_TAG:-latest}
    build: ..                     # `docker compose build`: the repo root (hatch-vcs needs its .git)
    container_name: iris-agent
    command: ["argus-iris", "agent"]
    restart: unless-stopped
    # Listed in the broker's service directory under its own name, with the health it serves (argus-cortex#212).
    labels:
      argus.peer: iris-agent
      argus.service: argus-iris
      argus.health: /health
      argus.port: "9110"
    runtime: nvidia
    pid: host                     # NVML reports host PIDs
    cgroup: host                  # else /proc/<pid>/cgroup paths are relative (/../..) and anon memory is unreadable
    ports:
      - "${HOST_IP:-127.0.0.1}:9110:9110"
    # Its own network: when compose.yaml runs the broker alongside, the broker still reaches it at the host's LAN
    # address like every other node's agent (Docker does not hairpin a published port back into the same bridge).
    networks: [iris-agent]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # container inspect + allow-listed start/stop/restart
      - /sys/fs/cgroup:/sys/fs/cgroup:ro            # per-container anonymous memory
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility,compute
      ARGUS_PEER: iris-agent      # the argus.peer label above, repeated for /health
      IRIS_AGENT_NODE: ${IRIS_AGENT_NODE:?a short name for this host's GPU}
      IRIS_AGENT_POLL_S: ${IRIS_AGENT_POLL_S:-5}
      # Broker→agent token. Unset disables container actions entirely.
      IRIS_AGENT_TOKEN: ${IRIS_AGENT_TOKEN:-}
      # The only containers the broker may start/stop/restart on this host, e.g. comfyui.
      IRIS_AGENT_CONTAINERS: ${IRIS_AGENT_CONTAINERS:-}
      # Also containers labelled argus.iris.manage=true (in their own compose file on this host). Off unless set to 1.
      IRIS_AGENT_MANAGE_LABEL: ${IRIS_AGENT_MANAGE_LABEL:-}
      # Announce this node to the broker, so a new GPU host needs no broker config. Needs IRIS_AGENT_TOKEN (the
      # broker checks it). IRIS_AGENT_URL only when the broker cannot reach this agent at the address it calls from.
      IRIS_BROKER_URL: ${IRIS_BROKER_URL:-}
      IRIS_AGENT_URL: ${IRIS_AGENT_URL:-}

networks:
  iris-agent: {}
