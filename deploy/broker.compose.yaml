# argus-iris broker, on morpheus. `docker compose -f deploy/broker.compose.yaml up -d`
# (a2f holds :8110 on morpheus, hence 8120.)
services:
  argus-iris:
    image: ghcr.io/smk762/argus-iris:${IRIS_TAG:-latest}
    build: ..                     # `docker compose build`: the repo root (hatch-vcs needs its .git)
    container_name: argus-iris
    command: ["argus-iris", "serve"]
    restart: unless-stopped
    # How the suite finds this service: iris's own directory lists containers by these labels (argus-cortex#212).
    labels:
      argus.peer: iris
      argus.service: argus-iris
      argus.health: /health
      argus.port: "8120"
    ports:
      - "${HOST_IP:-0.0.0.0}:8120:8120"
    volumes:
      - ${IRIS_CONFIG_FILE:-./iris.yaml}:/etc/argus-iris/iris.yaml:ro
      # Residency policy. The default is the shipped example, which only reports (no rule enforces).
      - ${IRIS_POLICY_FILE:-./policy.example.yaml}:/etc/argus-iris/policy.yaml:ro
      # Registrations (tenant manifests, the admin tokens they came with, announced nodes) across restarts.
      - iris-state:/var/lib/argus-iris
      # The suite file (argus_cortex.settings): the broker takes the tokens its config names (ARGUS_GPU_BROKER_TOKEN,
      # IRIS_AGENT_TOKEN, each token_env) from it when they are blank below. Commented out because compose has no
      # optional bind mount: with no file on the host, Docker would create a directory there. This container runs as
      # root, so the mounted file must be root-owned and not readable or writable by others (root:root, mode 600);
      # a file owned by your own user is refused, with a warning.
      # - /etc/argus/suite.env:/etc/argus/suite.env:ro
    environment:
      IRIS_CONFIG: /etc/argus-iris/iris.yaml
      IRIS_POLICY: /etc/argus-iris/policy.yaml
      IRIS_STATE_DIR: /var/lib/argus-iris
      ARGUS_PEER: iris            # the argus.peer label above, repeated for /health (a process cannot read its labels)
      # Callers' token (what argus-cortex's client sends). Manual actions such as warm are disabled while unset.
      ARGUS_GPU_BROKER_TOKEN: ${ARGUS_GPU_BROKER_TOKEN:-}
      # Sent to the agents for container actions; must match each agent's IRIS_AGENT_TOKEN.
      IRIS_AGENT_TOKEN: ${IRIS_AGENT_TOKEN:-}
      # Tokens the example config's token_env entries name.
      ARGUS_ADMIN_TOKEN: ${ARGUS_ADMIN_TOKEN:-}
      RAG_CHAT_API_KEY: ${RAG_CHAT_API_KEY:-}
      LENS_ADMIN_TOKEN: ${LENS_ADMIN_TOKEN:-}
      ECHO_ADMIN_TOKEN: ${ECHO_ADMIN_TOKEN:-}   # argus-echo engines' ARGUS_ADMIN_TOKEN (the same on every host)

volumes:
  iris-state: {}
